<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>La vida misma</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #222;
      padding: 20px;
    }

    .app {
      max-width: 500px;
      margin: auto;
    }

    header {
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 6px;
    }

    header p {
      color: #777;
      font-size: 15px;
    }

    .welcome {
      background: #222;
      color: white;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 22px;
    }

    .welcome h2 {
      margin-bottom: 8px;
    }

    .welcome p {
      color: #ddd;
      font-size: 14px;
      line-height: 1.5;
    }

    .card {
      width: 100%;
      background: white;
      border: none;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      text-align: left;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .card:active {
      transform: scale(0.98);
    }

    .card h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .card p {
      color: #777;
      font-size: 14px;
      line-height: 1.4;
    }

    footer {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin-top: 30px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <h1>La vida misma</h1>
      <p>Todo lo importante, en un solo lugar.</p>
    </header>

    <div class="welcome">
      <h2>¡Hola! 👋</h2>
      <p>
        Tu espacio personal para organizar,
        registrar y entender tu día a día.
      </p>
    </div>

    <button class="card" onclick="abrirFinanzas()">
      <h2>💰 Finanzas</h2>
      <p>Gastos, ingresos y control de tu dinero.</p>
    </button>

    <button class="card" onclick="abrirEntrenamiento()">
      <h2>🏋️ Entrenamiento</h2>
      <p>CrossFit, sala, carreras y evolución.</p>
    </button>

    <button class="card" onclick="abrirViajes()">
      <h2>✈️ Viajes</h2>
      <p>Destinos, planificación y gastos.</p>
    </button>

    <footer>
      La vida misma · Versión 0.2
    </footer>

  </div>

  <script>

    function abrirFinanzas() {
      alert("💰 Finanzas — próximamente");
    }

    function abrirEntrenamiento() {
      alert("🏋️ Entrenamiento — próximamente");
    }

    function abrirViajes() {
      alert("✈️ Viajes — próximamente");
    }

  </script>

</body>
</html>
